{% extends 'base_app/base.html' %}
{% load static %}

{% block title %}
<title>テーブル情報詳細</title>
{% endblock %}

{% block contents %}
<head>
    <style>
        /* 全体の基本設定 */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        /* ヘッダーのスタイル */
        .header {
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        /* フォームのスタイル */
        .content {
            width: 50%;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        /* 入力フィールドのスタイル */
        input[type="text"], select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* チェックボックスのスタイル */
        input[type="checkbox"] {
            margin-left: 10px;
        }

        /* ボタンのスタイル */
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #3258a5;
        }

        /* フッターのスタイル */
        .footer {
            text-align: center;
            margin-top: 20px;
        }

        .footer a {
            text-decoration: none;
            color: #0056b3;
            font-weight: bold;
        }

        .footer a:hover {
            text-decoration: underline;
        }

         /* 戻るボタンのスタイル */
         .footer a {
        display: inline-block;
        background-color: #007bff; /* 青色 */
        color: white;
        padding: 10px 15px;
        border-radius: 4px;
        text-decoration: none;
        font-weight: bold;
        text-align: center;
        margin-top: 10px;
    }

    .footer a:hover {
        background-color: #0056b3; /* 濃い青色 */
        text-decoration: underline;
    }
    </style>
</head>
<body>
    <div class="header">
        <h1>テーブル情報詳細</h1>
    </div>
    <div class="content">
        <form method="post">
            {% csrf_token %}
            <p>テーブル番号: <input type="text" name="table_number" value="{{ table.table_number }}"></p>
            <p>座席人数: <input type="text" name="recommended_capacity" value="{{ table.recommended_capacity }}"></p>
            <p>座席種別: 
                <select name="table_type">
                    <option value="0" {% if table.table_type == 0 %}selected{% endif %}>カウンター席</option>
                    <option value="1" {% if table.table_type == 1 %}selected{% endif %}>テーブル席</option>                    
                    <option value="2" {% if table.table_type == 2 %}selected{% endif %}>ソファ席</option>                    
                </select>
            </p>
            <p>使用状況: <input type="checkbox" name="table_reservation" {% if table.table_reservation %}checked{% endif %}></p>
            <p>コンセント有無: <input type="checkbox" name="electrical_outlet" {% if table.electrical_outlet %}checked{% endif %}></p>
            <p>清掃済: <input type="checkbox" name="clean_status" {% if table.clean_status %}checked{% endif %}></p>
            <p>連結有無: <input type="checkbox" name="table_connect" {% if table.table_connect %}checked{% endif %}></p>
            <button type="submit">保存</button>
        </form>
    </div>
    <div class="footer">
        <a href="{% url 'employee:employee_confirm' %}">戻る</a>
    </div>
</body>
{% endblock %}
